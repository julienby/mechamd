name: Publish

# Publication sur PyPI par Trusted Publishing : pousser un tag `vX.Y.Z` égal à la version du paquet.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: tag = version du paquet
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - run: uv build
      - name: le wheel s'installe et construit la vitrine
        run: |
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke dist/*.whl
          /tmp/smoke/bin/mecha build showcase -o /tmp/site
          test -f /tmp/site/_mecha/mecha.css
          test -f /tmp/site/_mecha/fonts/inter-latin-wght-normal.woff2
      - run: uv publish --trusted-publishing always
