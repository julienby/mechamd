{# section · hero : grande ouverture de page, titre affiche, action principale. #}
<section {{ root_attrs(block) }}{% if not block.id and anchor %} id="{{ anchor }}"{% endif %} class="relative isolate mx-auto max-w-5xl scroll-mt-8 overflow-hidden rounded-2xl px-6 py-16 text-center sm:px-12{% if image %} bg-stone-900{% else %} bg-stone-100 dark:bg-stone-800/60{% endif %}">
  {% if image %}
  <img src="{{ image }}" alt="{{ alt }}" class="absolute inset-0 -z-10 size-full object-cover">
  <div aria-hidden="true" class="absolute inset-0 -z-10 bg-linear-to-t from-stone-950/90 via-stone-950/40 to-stone-950/0"></div>
  {% endif %}
  {% if title %}
  <h2 class="mx-auto max-w-2xl font-serif text-5xl leading-tight font-medium tracking-tight text-balance sm:text-6xl{% if image %} text-white{% else %} text-stone-900 dark:text-stone-50{% endif %}">{{ title }}</h2>
  {% endif %}
  {% if body %}
  <div class="mecha-prose mx-auto mt-6 max-w-2xl text-lg leading-relaxed text-pretty{% if image %} mecha-prose-invert text-white/80{% else %} text-stone-700 dark:text-stone-300{% endif %}">{{ body | safe }}</div>
  {% endif %}
  {% if href %}
  <a href="{{ href }}" class="group mt-8 inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-6 py-3 text-sm font-medium text-white shadow-sm transition duration-200 hover:bg-indigo-700 dark:bg-indigo-500 dark:hover:bg-indigo-400">
    {{ action }}
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 transition duration-200 group-hover:translate-x-0.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
  </a>
  {% endif %}
</section>
