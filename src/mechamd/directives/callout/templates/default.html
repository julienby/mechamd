{# callout · default : information neutre (aussi rendue par .info) #}
<aside {{ root_attrs(block) }} role="note" class="flex gap-3 rounded-2xl border border-sky-200 bg-sky-50 p-6 text-sky-900 dark:border-sky-900 dark:bg-sky-950/40 dark:text-sky-100">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 size-5 shrink-0 text-sky-600 dark:text-sky-400"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
  <div class="min-w-0 flex-1">
    {% if label or title %}
    <p class="text-sm font-semibold">{% if label %}<span class="text-sky-700 dark:text-sky-300">{{ label }}</span>{% endif %}{% if label and title %} · {% endif %}{% if title %}<span class="font-serif text-base">{{ title }}</span>{% endif %}</p>
    {% endif %}
    {% if body %}
    <div class="mecha-prose text-base leading-relaxed{% if label or title %} mt-1{% endif %}">{{ body | safe }}</div>
    {% endif %}
  </div>
</aside>
