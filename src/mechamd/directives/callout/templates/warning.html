{# callout · warning : attention, précaution #}
<aside {{ root_attrs(block) }} role="note" class="flex gap-3 rounded-2xl border border-amber-200 bg-amber-50 p-6 text-amber-900 dark:border-amber-900 dark:bg-amber-950/40 dark:text-amber-100">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 size-5 shrink-0 text-amber-600 dark:text-amber-400"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4M12 17h.01"/></svg>
  <div class="min-w-0 flex-1">
    {% if label or title %}
    <p class="text-sm font-semibold">{% if label %}<span class="text-amber-700 dark:text-amber-300">{{ label }}</span>{% endif %}{% if label and title %} · {% endif %}{% if title %}<span class="font-serif text-base">{{ title }}</span>{% endif %}</p>
    {% endif %}
    {% if body %}
    <div class="mecha-prose text-base leading-relaxed{% if label or title %} mt-1{% endif %}">{{ body | safe }}</div>
    {% endif %}
  </div>
</aside>
