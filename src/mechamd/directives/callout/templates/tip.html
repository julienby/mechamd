{# callout · tip : astuce, conseil #}
<aside {{ root_attrs(block) }} role="note" class="flex gap-3 rounded-2xl border border-emerald-200 bg-emerald-50 p-6 text-emerald-900 dark:border-emerald-900 dark:bg-emerald-950/40 dark:text-emerald-100">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mt-0.5 size-5 shrink-0 text-emerald-600 dark:text-emerald-400"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6M10 22h4"/></svg>
  <div class="min-w-0 flex-1">
    {% if label or title %}
    <p class="text-sm font-semibold">{% if label %}<span class="text-emerald-700 dark:text-emerald-300">{{ label }}</span>{% endif %}{% if label and title %} · {% endif %}{% if title %}<span class="font-serif text-base">{{ title }}</span>{% endif %}</p>
    {% endif %}
    {% if body %}
    <div class="mecha-prose text-base leading-relaxed{% if label or title %} mt-1{% endif %}">{{ body | safe }}</div>
    {% endif %}
  </div>
</aside>
