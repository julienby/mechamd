{# cta · default : bandeau d'accent centré, titre, phrase, un bouton. #}
<section {{ root_attrs(block) }} class="rounded-2xl bg-indigo-600 p-6 text-center shadow-sm sm:p-8 dark:bg-indigo-500">
  {% if title %}
  <h2 class="font-serif text-3xl leading-tight font-medium tracking-tight text-balance text-white">{{ title }}</h2>
  {% endif %}
  {% if text %}
  <div class="mecha-prose mt-3 text-base leading-relaxed text-pretty text-white/80">{{ text | safe }}</div>
  {% endif %}
  {% if action %}
  <a href="{{ action.href }}" class="mt-6 inline-block rounded-lg bg-white px-6 py-3 text-sm font-medium text-indigo-700 transition duration-200 hover:bg-stone-100 dark:text-indigo-600">{{ action.text }}</a>
  {% endif %}
</section>
