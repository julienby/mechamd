{# figure · wide : images en largeur de bloc visuel, légende dans la colonne de lecture. #}
<figure {{ root_attrs(block) }} class="mx-auto max-w-5xl">
  {% for image in images %}
  <img src="{{ image.src }}" alt="{{ image.alt }}" loading="lazy" class="w-full rounded-lg bg-stone-100 dark:bg-stone-800{% if not loop.first %} mt-4{% endif %}">
  {% endfor %}
  {% if caption %}
  <figcaption class="mecha-prose mx-auto mt-3 max-w-2xl text-sm text-stone-500 dark:text-stone-400">{{ caption | safe }}</figcaption>
  {% endif %}
</figure>
