{# card · cover : image en fond plein cadre, texte par-dessus. Sans image : fond d'accent. #}
<article {{ root_attrs(block) }} class="group relative isolate flex min-h-80 flex-col justify-end gap-2 overflow-hidden rounded-2xl bg-linear-to-br from-indigo-600 to-indigo-800 p-6 shadow-sm transition duration-200 sm:p-8 dark:from-indigo-500 dark:to-indigo-900{% if href %} hover:-translate-y-0.5 hover:shadow-md{% endif %}">
  {% if image %}
  <img src="{{ image }}" alt="{{ alt }}" loading="lazy" class="absolute inset-0 -z-10 size-full object-cover">
  <div aria-hidden="true" class="absolute inset-0 -z-10 bg-linear-to-t from-stone-950/90 via-stone-950/40 to-stone-950/0"></div>
  {% endif %}
  {% if title %}
  <h3 class="font-serif text-3xl leading-tight font-medium tracking-tight text-balance text-white">{{ title }}</h3>
  {% endif %}
  {% if body %}
  <div class="mecha-prose mecha-prose-invert text-base leading-relaxed text-white/80">{{ body | safe }}</div>
  {% endif %}
  {% if href %}
  <a href="{{ href }}" class="mt-2 inline-flex items-center gap-1 text-sm font-medium text-white after:absolute after:inset-0 after:rounded-2xl">
    {{ action }}
    <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4 transition duration-200 group-hover:translate-x-0.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
  </a>
  {% endif %}
</article>
