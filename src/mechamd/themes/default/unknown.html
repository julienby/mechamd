{# Bloc non compris (directive inconnue ou en erreur) : le texte reste lisible. #}
<aside {{ root_attrs(block) }} class="rounded-2xl border border-dashed border-stone-300 p-6 dark:border-stone-700">
  <p class="text-xs font-semibold tracking-widest text-stone-500 uppercase dark:text-stone-400">{{ block.name }} · {{ reason }}</p>
  <div class="mecha-prose mt-3 text-base leading-relaxed">{{ body }}</div>
</aside>
