<!doctype html>
<html lang="{{ page.meta.get('lang', 'fr') }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <script>
    try {
      const saved = localStorage.getItem("mecha-theme");
      const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ page.root }}_mecha/mecha.css">
</head>
<body class="min-h-screen" data-layout="{{ page.layout }}">
  <header class="mx-auto flex max-w-5xl items-center justify-between px-4 py-6 sm:px-6">
    <a href="{{ page.root or './' }}" class="font-serif text-lg font-semibold tracking-tight text-stone-900 dark:text-stone-50">{{ page.meta.get('site', 'mechamd') }}</a>
    <button type="button" data-mecha-theme-toggle aria-label="Basculer le mode sombre" class="rounded-full p-2 text-stone-500 transition duration-200 hover:bg-stone-100 hover:text-stone-900 dark:text-stone-400 dark:hover:bg-stone-800/60 dark:hover:text-stone-50">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-5 dark:hidden"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden size-5 dark:block"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
    </button>
  </header>

{% block main %}{% endblock %}

  <footer class="mx-auto max-w-5xl px-4 py-12 text-sm text-stone-500 sm:px-6 dark:text-stone-400">
    Écrit en Markdown, mis en page par mechamd.
  </footer>

  <script>
    document.querySelector("[data-mecha-theme-toggle]")?.addEventListener("click", () => {
      const dark = document.documentElement.classList.toggle("dark");
      try { localStorage.setItem("mecha-theme", dark ? "dark" : "light"); } catch (e) {}
    });
  </script>
</body>
</html>
