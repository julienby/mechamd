{% extends "base.html" %}
{# Page d'accueil produit : titre centré en affiche, phrase d'accroche (`lead:`), blocs larges. #}
{% block main %}
  <div class="mx-auto max-w-5xl px-4 pb-16 sm:px-6">
    <article class="mecha-flow">
      <header class="mt-16 mb-12 text-center">
        {% if not page.has_h1 %}
        <h1 class="mx-auto max-w-3xl font-serif text-5xl leading-tight font-medium tracking-tight text-balance text-stone-900 sm:text-6xl dark:text-stone-50">{{ page.title }}</h1>
        {% endif %}
        {% if page.meta.get('lead') %}
        <p class="mx-auto mt-6 max-w-2xl text-lg leading-relaxed text-pretty text-stone-500 dark:text-stone-400">{{ page.meta.lead }}</p>
        {% endif %}
      </header>
{{ content }}
    </article>
  </div>
{% endblock %}
