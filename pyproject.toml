[project]
name = "mechamd"
version = "0.1.0"
description = "Transforme des notes Markdown avec directives en belles pages web Tailwind."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Julien Baudry" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
    "python-frontmatter>=1.1",
    "jinja2>=3.1",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "watchfiles>=0.22",
]

[project.urls]
Repository = "https://github.com/julienby/mechamd"

[project.scripts]
mecha = "mechamd.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx2>=2.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mechamd"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["SPEC.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]
exclude = ["tests/fixtures/"]
mypy_path = "src"
explicit_package_bases = true
python_version = "3.11"

[[tool.mypy.overrides]]
module = ["frontmatter", "frontmatter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mechamd --cov-report=term-missing --cov-fail-under=85"
